<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kontrollera en kursplan för Civilingenjör i teknisk matematik (6CTMA, Linköpings universitet), termin 7–9, mot masterprofil, teknisk inriktning och examenskrav.">
<title>TMA Degree Check</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Fonts are served from this site (fonts/, SIL OFL) so the page talks to one server; the body font is preloaded. -->
<link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: swap; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-display: swap; src: url("fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-display: swap; src: url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 600; font-display: swap; src: url("fonts/ibm-plex-sans-condensed-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
/* Layout: a two-column audit sheet. Plan inputs on the left, the requirement checklist on the right, course breakdown and timetable below.
   Flat: white surfaces, hairline borders, neutral greys. Color as outlines and text rather than fills: green met, red not met / collision, blue accent. */
:root {
  --bg: #f6f6f5;
  --surface: #ffffff;
  --field: #f6f6f5;
  --ink: #1b1b1b;
  --muted: #666664;
  --line: #e1e1de;
  --strong: #2b2b2b;   /* selected chips, active toggle */
  --accent: #1d5d73;   /* links, focus, selection, course roles */
  --accent-soft: #e8eff2;
  --ok: #2b7547;
  --bad: #b23f2c;
  --warn: #8a5f0e;
  --radius: 6px;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --surface: #1b1b1b; --field: #232323; --ink: #e8e8e6; --muted: #a0a09d; --line: #303030;
    --strong: #e8e8e6; --accent: #7fbdd2; --accent-soft: #1f2c31; --ok: #6cc48e; --bad: #f08c77; --warn: #e0b45c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --surface: #1b1b1b; --field: #232323; --ink: #e8e8e6; --muted: #a0a09d; --line: #303030;
  --strong: #e8e8e6; --accent: #7fbdd2; --accent-soft: #1f2c31; --ok: #6cc48e; --bad: #f08c77; --warn: #e0b45c; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: start; }
header > :not(.lang) { grid-column: 1; }
.lang { grid-column: 2; grid-row: 1 / span 3; display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.lang button { border: 0; border-radius: 0; padding: 6px 10px; font-family: var(--font-mono); font-size: 12px; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 5vw, 42px); line-height: 1.05; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 68ch; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
h3 { font-size: 12px; font-family: var(--font-mono); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }

.layout { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 18px; min-width: 0; }
.field { display: grid; gap: 6px; }
label { font-weight: 600; font-size: 14px; }
select, textarea {
  font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 9px 10px; width: 100%;
}
textarea { font-family: var(--font-mono); font-size: 14px; min-height: 150px; resize: vertical; line-height: 1.6; }
select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: var(--radius); padding: 6px 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
button:hover { border-color: var(--accent); color: var(--accent); }
.lang button[aria-pressed="true"]:hover { color: var(--surface); }
.example-tag { font-size: 12px; font-family: var(--font-mono); color: var(--warn); }

/* Course picker */
.picker { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 18px; }
.picker-group { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-mono); font-size: 12.5px; padding: 4px 8px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; gap: 6px; align-items: baseline;
}
.chip .hp { color: var(--muted); font-size: 11.5px; }
.chip .tag { font-size: 10.5px; color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip[aria-pressed="true"] .hp, .chip[aria-pressed="true"] .tag { color: var(--surface); opacity: .75; }

/* Results */
.results { display: grid; gap: 22px; min-width: 0; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
@media (max-width: 520px) { .verdict .export-open { grid-column: 1 / -1; justify-self: start; } }

/* Export dialog */
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog form { display: grid; gap: 16px; padding: 20px; }
dialog fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
dialog legend { font-weight: 600; font-size: 14px; margin-bottom: 6px; padding: 0; }
.format { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; font-weight: 400; }
.format:has(input:checked) { border-color: var(--accent); }
.format input { margin: 0; accent-color: var(--accent); }
.format b { font-weight: 600; }
.format span { grid-column: 2; font-size: 13px; color: var(--muted); }
.export-status { border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; }
.export-status.bad { border-left-color: var(--bad); }
.export-status strong { display: block; }
.export-status.bad strong { color: var(--bad); }
.export-status ul { margin: 6px 0; padding-left: 18px; display: grid; gap: 2px; }
.export-status p { margin: 6px 0 0; color: var(--muted); }
.export-error { color: var(--bad); font-size: 14px; margin: 0; }
.dialog-buttons { justify-content: flex-end; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.primary:hover { color: var(--surface); opacity: .9; }
button:disabled { opacity: .5; cursor: default; }
.verdict .score { font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.verdict .score small { font-size: 20px; color: var(--muted); }
.verdict strong { display: block; font-size: 17px; }
.verdict span { color: var(--muted); font-size: 14px; display: block; }
.verdict .clash-line { color: var(--bad); }
.verdict.reqs-ok .score { color: var(--ok); }
.verdict.reqs-bad .score { color: var(--bad); }
.verdict.all-ok { border-color: var(--ok); }
.verdict.has-clash, .verdict.reqs-bad { border-color: var(--bad); }

.warnings { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.warnings li { border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: var(--radius); background: var(--surface); padding: 8px 12px; font-size: 14px; color: var(--warn); }

.req-group { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.req-group > h3 { padding: 12px 18px 10px; border-bottom: 1px solid var(--line); }
.req { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.req:last-child { border-bottom: 0; }
.pill { grid-row: span 2; align-self: start; justify-self: start; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.ok { color: var(--ok); }
.pill.bad { color: var(--bad); }
.pill.ok::before { content: "✓ "; }
.pill.bad::before { content: "✗ "; }
.req-title { font-weight: 600; }
.req-detail { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.meter { grid-column: 2; height: 5px; background: var(--field); border-radius: 3px; position: relative; overflow: hidden; margin-top: 4px; max-width: 420px; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 3px; }
.meter.bad i { background: var(--bad); }
@media (max-width: 520px) { .req { grid-template-columns: minmax(0, 1fr); padding: 12px 14px; } .pill { grid-row: auto; } .meter { grid-column: 1; } }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-weight: 500; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.sem-head th { background: var(--field); color: var(--ink); font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0; text-transform: none; padding: 8px 14px; }
tr.sem-head th span { float: right; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
tr.period-head td { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px 14px 4px; border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
td.code { font-family: var(--font-mono); white-space: nowrap; }
tr.clashing td.code { color: var(--bad); font-weight: 600; }
td select { width: auto; padding: 4px 6px; font-size: 13px; font-family: var(--font-mono); }
.slots { display: block; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-top: 3px; min-width: 9em; }
.role { font-size: 13px; color: var(--muted); }
.role.profile, .role.spec { color: var(--accent); font-weight: 500; }
.role.outside { color: var(--warn); }
.role.excluded { text-decoration: line-through; }
.course-note { display: block; font-size: 12.5px; color: var(--muted); }
.empty { padding: 18px; color: var(--muted); }

/* Timetable */
.tt-summary { display: flex; flex-wrap: wrap; gap: 8px; }
.sem-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; display: grid; min-width: 104px; }
.sem-tile b { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sem-tile span { font-size: 12px; color: var(--muted); }
.ok-note { font-size: 14px; margin: 0; }
.ok-note::before { content: "✓ "; color: var(--ok); font-weight: 600; }
.caveat { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; margin: 0; color: var(--muted); }
.caveat strong { display: block; color: var(--warn); }
.clash { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.clash-head { display: grid; gap: 2px; }
.clash-head strong { font-size: 16px; }
.clash-head span { color: var(--muted); font-size: 14px; }
.alts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.alts li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.alts li > div { min-width: 0; overflow-wrap: anywhere; }
.alt-kind { font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); display: block; }
.alt-meta { color: var(--muted); font-size: 13px; display: block; }
.search-links { font-size: 13px; color: var(--muted); }
a { color: var(--accent); }

.assumed { display: grid; gap: 8px; }
.assumed ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; max-width: 75ch; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .25s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1>TMA Degree Check</h1>
    <p data-i18n="intro"></p>
    <div class="lang" role="group" aria-label="Language / Språk">
      <button type="button" id="lang-sv" lang="sv">Svenska</button>
      <button type="button" id="lang-en" lang="en">English</button>
    </div>
  </header>

  <div class="layout">
    <form class="panel" id="plan" autocomplete="off">
      <div class="field">
        <label for="cohort" data-i18n="cohort"></label>
        <select id="cohort"></select>
      </div>
      <div class="field">
        <label for="profile" data-i18n="profile"></label>
        <select id="profile"></select>
      </div>
      <div class="field">
        <label for="spec" data-i18n="spec"></label>
        <select id="spec"></select>
      </div>
      <div class="field">
        <div class="row" style="justify-content: space-between;">
          <label for="courses" data-i18n="courses"></label>
          <span class="example-tag" id="example-tag" data-i18n="exampleTag" hidden></span>
        </div>
        <textarea id="courses" spellcheck="false" placeholder="TAMS46, TDDE09, TAMS48, …"></textarea>
        <p class="hint" data-i18n-html="coursesHint"></p>
        <div class="row">
          <button type="button" id="clear" data-i18n="clear"></button>
          <button type="button" id="example" data-i18n="loadExample"></button>
        </div>
      </div>
      <div class="picker" id="picker"></div>
    </form>

    <section class="results" aria-live="polite">
      <div class="verdict" id="verdict"></div>
      <ul class="warnings" id="warnings"></ul>
      <div id="reqs" class="results"></div>
      <div class="results">
        <h2 data-i18n="yourCourses"></h2>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th data-i18n="thCode"></th><th data-i18n="thCourse"></th><th style="text-align:right">hp</th>
              <th data-i18n="thLevel"></th><th data-i18n="thSemester"></th><th data-i18n="thCounts"></th>
            </tr></thead>
            <tbody id="course-rows"></tbody>
          </table>
        </div>
      </div>
      <div class="results" id="timetable"></div>
      <div class="assumed">
        <h2 data-i18n="assumedTitle"></h2>
        <ul id="assumed"></ul>
      </div>
    </section>
  </div>

  <footer>
    <span data-i18n="unofficial"></span>
    <span id="source-line"></span>
  </footer>
</div>

<dialog id="export-dialog" aria-labelledby="export-title">
  <form id="export-form" method="dialog">
    <h2 id="export-title" data-i18n="exportTitle"></h2>
    <fieldset>
      <legend data-i18n="exportFormat"></legend>
      <label class="format"><input type="radio" name="format" value="pdf" id="format-pdf" checked><b>PDF</b><span data-i18n="exportPdfHint"></span></label>
      <label class="format"><input type="radio" name="format" value="xlsx" id="format-xlsx"><b>Excel (.xlsx)</b><span data-i18n="exportXlsxHint"></span></label>
    </fieldset>
    <div id="export-status" class="export-status"></div>
    <p class="export-error" id="export-error" hidden></p>
    <div class="row dialog-buttons">
      <button type="button" id="export-cancel" data-i18n="exportCancel"></button>
      <button type="submit" id="export-go" class="primary"></button>
    </div>
  </form>
</dialog>

// Degree requirement and timetable checks for 6CTMA, semesters 7–9.
// Years 1–3, the thesis (30 hp) and the language requirement are assumed done.

// 300 hp = 180 (years 1–3) + 90 (semesters 7–9) + 30 (thesis).
const TOTAL_HP = 90;
// 90 hp advanced level in total, of which the thesis is 30.
const ADVANCED_HP = 60;
// 30 hp advanced level in the main field (Tillämpad matematik).
const MAIN_FIELD_HP = 30;
const DEFAULT_OUTSIDE_HP = 6;
// Autumn courses can be taken in semester 7 or 9, spring courses in semester 8.
const TERM_SEMESTERS = { HT: [7, 9], VT: [8] };
const termOf = (sem) => (sem === 8 ? 'VT' : 'HT');

const list = (items, lang) => {
  const and = lang === 'sv' ? ' och ' : ' and ';
  return items.length < 2 ? items.join('') : items.slice(0, -1).join(', ') + and + items[items.length - 1];
};
const orList = (items, lang) => {
  const or = lang === 'sv' ? ' eller ' : ' or ';
  return items.length < 2 ? items.join('') : items.slice(0, -1).join(', ') + or + items[items.length - 1];
};
const fmt = (hp) => (Math.round(hp * 10) / 10).toString().replace('.', ',');
const plural = (n, one, many) => (n === 1 ? one : many);

    basicLevel: 'Kurser utanför programplanen räknas som grundnivå om du inte lägger till :A, t.ex. ABC123:7.5:A.',
  },
};

function parseInput(text) {
  const tokens = text.toUpperCase().split(/[\s,;]+/).filter(Boolean);
  const entries = [], invalid = [], duplicates = [];
  const seen = new Set();
  for (const tok of tokens) {
    const m = tok.match(/^([A-Z0-9]{4,8})(?::(\d+(?:[.,]\d+)?))?(?::(A))?$/);
    if (!m) { invalid.push(tok); continue; }
    if (seen.has(m[1])) { duplicates.push(m[1]); continue; }
    seen.add(m[1]);
    entries.push({ code: m[1], hp: m[2] ? parseFloat(m[2].replace(',', '.')) : null, adv: !!m[3] });
  }
  return { entries, invalid, duplicates };
}

const sum = (items) => items.reduce((s, c) => s + c.hp, 0);
const isAdv = (level) => /^A/.test(level || '');

// Semesters a course can be taken in, from the terms it is scheduled in.
function semesterOptions(info) {
  if (!info || !info.s) return [];
  return Object.keys(info.s).flatMap((term) => TERM_SEMESTERS[term]).sort();
}

// The shared [period, block] if two courses cannot avoid each other, otherwise null.
// Each course has one or more instances (alternative offerings); a collision only counts
// if every combination of instances shares a block.
function clash(instsA, instsB) {
  if (!instsA.length || !instsB.length) return null;
  let first = null;
  for (const a of instsA) {
    for (const b of instsB) {
      const shared = a.find(([p, blk]) => blk !== '-' && b.some(([q, blk2]) => q === p && blk2 === blk));
      if (!shared) return null;
      first = first || shared;
    }
  }
  return first;
}

function classify(cohort, profile, spec, entry, M, lang) {
  const info = cohort.courses[entry.code];
  const inProfile = entry.code in profile.c;
  const inSpec = entry.code in spec.c;
  const listings = [cohort.general[entry.code], ...Object.values(cohort.groups).map((g) => g.c[entry.code])]
    .filter(Boolean);
  const base = { code: entry.code, name: info ? (lang === 'en' ? info.ne : info.n) : null, hp: info ? info.hp : entry.hp,
    level: info ? info.l : null, tm: info ? info.tm : false, inProfile, inSpec, counted: true, role: null, note: '' };

  if (info && (info.l === 'A2E' || /^TQXX/.test(entry.code))) {
    return { ...base, counted: false, role: 'excluded', note: M.thesis };
  }
  if (listings.length) {
    if (listings.every((v) => v === 'f')) return { ...base, counted: false, role: 'excluded', note: M.voluntary };
    return { ...base, role: inProfile ? 'profile' : inSpec ? 'spec' : 'elective' };
  }
  if (info) {
    const vof = cohort.early[entry.code];
    if (vof === 'o') return { ...base, counted: false, role: 'excluded', note: M.early };
    if (vof === 'f') return { ...base, counted: false, role: 'excluded', note: M.voluntary };
    return { ...base, role: 'elective', note: M.earlyElective };
  }
  return { ...base, hp: entry.hp ?? DEFAULT_OUTSIDE_HP, level: entry.adv ? 'A' : null, role: 'outside',
    hpAssumed: entry.hp == null, note: entry.hp == null ? M.outsideAssumed(DEFAULT_OUTSIDE_HP) : M.outside };
}

// Ways around a collision between course x and course y in semester sem, each checked against
// everything else placed in the target semester.
function alternatives(cohort, alt, placed, x, sem) {
  const others = (target) => placed.filter((p) => p.code !== x.code && p.sem === target);
  const blockers = (insts, target) => others(target)
    .filter((p) => !(p.coord || []).includes(x.code) && clash(insts, p.insts)).map((p) => p.code);
  const out = [];

  // 1. The same course in the other autumn semester.
  for (const target of x.options) {
    if (target === sem) continue;
    const insts = x.info.s[termOf(target)];
    const b = blockers(insts, target);
    if (!b.length) out.push({ type: 'move', code: x.code, sem: target, slots: insts });
  }
  if (!alt) return out;

  // 2. The same course given for another program, with a different timetable.
  const own = (term) => JSON.stringify((x.info.s[term] || []).map((i) => [...i].sort()));
  for (const g of (alt.c[x.code] || {}).g || []) {
    const term = g.t.slice(0, 2);
    if (own(term).includes(JSON.stringify([...g.s].sort()))) continue;
    const target = TERM_SEMESTERS[term].find((t) => !blockers([g.s], t).length);
    if (target) out.push({ type: 'program', code: x.code, sem: target, group: g });
  }

  // 3. A T-course with a similar name, under a different code.
  for (const code of (alt.c[x.code] || {}).sim || []) {
    // Skip courses already in the plan and mandatory year 1–3 courses (already taken).
    if (placed.some((p) => p.code === code) || cohort.early[code] === 'o') continue;
    const info = alt.c[code];
    if (!info) continue;
    for (const g of info.g || []) {
      const target = TERM_SEMESTERS[g.t.slice(0, 2)].find((t) => !blockers([g.s], t).length);
      if (target) out.push({ type: 'similar', code, info, inPlan: code in cohort.courses, sem: target, group: g });
    }
  }
  return out;
}

function timetable(cohort, alt, courses, semesters) {
  const placed = courses.filter((c) => c.counted).map((c) => {
    const info = cohort.courses[c.code];
    const options = semesterOptions(info);
    if (!options.length) return null;
    const sem = options.includes(semesters[c.code]) ? semesters[c.code] : Math.min(...info.sem);
    c.sem = sem;
    c.semOptions = options;
    return { code: c.code, sem, options, info, insts: info.s[termOf(sem)], coord: info.coord };
  }).filter(Boolean);

  // For courses with several offerings in a term (TEAE01 in period 1 or 2), use the one that
  // collides with the fewest other courses in the same semester.
  for (const p of placed) {
    const score = (inst) => placed.filter((o) => o !== p && o.sem === p.sem && !(p.coord || []).includes(o.code)
      && clash([inst], o.insts)).length;
    const best = p.insts.reduce((a, b) => (score(b) < score(a) ? b : a));
    const course = courses.find((c) => c.code === p.code);
    course.slots = best;
    course.otherSlots = p.insts.filter((i) => i !== best);
  }

  const collisions = [];
  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const a = placed[i], b = placed[j];
      if (a.sem !== b.sem || (a.coord || []).includes(b.code)) continue;
      const slot = clash(a.insts, b.insts);
      if (slot) {
        collisions.push({ a: a.code, b: b.code, sem: a.sem, period: slot[0], block: slot[1],
          options: [...alternatives(cohort, alt, placed, a, a.sem), ...alternatives(cohort, alt, placed, b, b.sem)] });
      }
    }
  }
  const perSemester = { 7: 0, 8: 0, 9: 0 };
  for (const c of courses) if (c.counted && c.sem) perSemester[c.sem] += c.hp;
  const unplaced = courses.filter((c) => c.counted && !c.sem);
  return { collisions, perSemester, unplacedHp: sum(unplaced) };
}

function validate(cohort, profileCode, specCode, text, opts = {}) {
  const lang = opts.lang === 'sv' ? 'sv' : 'en';
  const M = MESSAGES[lang];
  const profile = cohort.groups[profileCode];
  const spec = cohort.groups[specCode];
  const specName = lang === 'en' ? spec.name_en : spec.name;
  const rules = cohort.rules;
  const { entries, invalid, duplicates } = parseInput(text);
  const courses = entries.map((e) => classify(cohort, profile, spec, e, M, lang));
  const counted = courses.filter((c) => c.counted);
  const taken = new Set(counted.map((c) => c.code));
  const reqs = [];
  const req = (id, title, ok, detail, progress) => reqs.push({ id, title, ok, detail, progress });
  const missingOf = (codes) => codes.filter((c) => !taken.has(c));
  const label = (code) => {
    const info = cohort.courses[code];
    return `${code}${info ? ' ' + (lang === 'en' ? info.ne : info.n) : ''}`;
  };

  // Master profile
  const profMand = Object.keys(profile.c).filter((c) => profile.c[c] === 'o');
  const profMissing = missingOf(profMand);
  req('profile-mandatory', M.profMandTitle, profMissing.length === 0,
    profMand.length === 0 ? M.none
      : profMissing.length ? M.missing(profMissing.map(label).join(', ')) : M.included(profMand.map(label).join(', ')));

  const profCourses = counted.filter((c) => c.inProfile);
  const profHp = sum(profCourses);
  req('profile-hp', M.profHpTitle(rules.profileHp), profHp >= rules.profileHp,
    M.hpFrom(fmt(profHp), rules.profileHp, profCourses.length, M.profile), { value: profHp, target: rules.profileHp });

  const profAdv = profCourses.filter((c) => isAdv(c.level));
  req('profile-adv', M.profAdvTitle(rules.profileAdvCourses), profAdv.length >= rules.profileAdvCourses,
    M.countOf(profAdv.length, rules.profileAdvCourses, profAdv.map((c) => c.code).join(', ')),
    { value: profAdv.length, target: rules.profileAdvCourses });

  // Technical specialization
  const specMand = Object.keys(spec.c).filter((c) => spec.c[c] === 'o');
  const specChoice = Object.keys(spec.c).filter((c) => spec.c[c] === 'o/v');
  const specMissing = missingOf(specMand);
  const choiceOk = specChoice.length === 0 || specChoice.some((c) => taken.has(c));
  const specParts = [];
  if (specMissing.length) specParts.push(M.missing(specMissing.map(label).join(', ')));
  if (!choiceOk) specParts.push(M.pickOne(specChoice.map(label).join(', ')));
  if (!specParts.length) specParts.push(M.included([...specMand, ...specChoice.filter((c) => taken.has(c))].map(label).join(', ')));
  req('spec-mandatory', M.specMandTitle, specMissing.length === 0 && choiceOk, specParts.join(' '));

  const specCourses = counted.filter((c) => c.inSpec);
  const specHp = sum(specCourses);
  req('spec-hp', M.specHpTitle(rules.specHp), specHp >= rules.specHp,
    M.hpFrom(fmt(specHp), rules.specHp, specCourses.length, M.specialization), { value: specHp, target: rules.specHp });

  // Business course: a specialization may make one of the alternatives mandatory (Finansiell matematik: TEAE01).
  const forced = cohort.business.filter((c) => spec.c[c] === 'o');
  const bizOptions = forced.length ? forced : cohort.business;
  const bizTaken = bizOptions.filter((c) => taken.has(c));
  let bizDetail = bizTaken.length ? M.included(bizTaken.map(label).join(', '))
    : bizOptions.length === 1 ? M.add(label(bizOptions[0])) : M.addOneOf(orList(bizOptions.map(label), lang));
  if (forced.length) bizDetail += ' ' + M.requires(specName, forced.join(', '));
  else if (rules.businessText.join() !== cohort.business.join()) {
    bizDetail += ' ' + M.bizConflict(list(rules.businessText, lang), cohort.business.filter((c) => !rules.businessText.includes(c)).join(', '));
  }
  req('business', M.bizTitle, bizTaken.length > 0, bizDetail);

  // Courses outside the program plan
  const outside = counted.filter((c) => c.role === 'outside');
  const outsideHp = sum(outside);
  req('outside', M.outsideTitle(rules.outsideMax), outsideHp <= rules.outsideMax,
    outside.length ? M.outsideHp(fmt(outsideHp), outside.map((c) => c.code).join(', '), outsideHp > rules.outsideMax ? rules.outsideMax : 0)
      : M.noOutside,
    { value: outsideHp, target: rules.outsideMax, max: true });

  // Credit totals. Outside-plan credits above the cap do not count.
  const totalHp = sum(counted) - Math.max(0, outsideHp - rules.outsideMax);
  req('total', M.totalTitle(TOTAL_HP), totalHp >= TOTAL_HP, M.totalDetail(fmt(totalHp), TOTAL_HP), { value: totalHp, target: TOTAL_HP });

  // Mandatory advanced-level courses from years 1–3 (TANA31) count toward the advanced totals.
  const earlyAdv = Object.keys(cohort.early)
    .filter((c) => cohort.early[c] === 'o' && isAdv(cohort.courses[c].l))
    .map((c) => ({ code: c, ...cohort.courses[c] }));
  const advHp = sum(counted.filter((c) => isAdv(c.level))) + sum(earlyAdv);
  req('advanced', M.advTitle(ADVANCED_HP), advHp >= ADVANCED_HP,
    M.advDetail(fmt(advHp), ADVANCED_HP, earlyAdv.map((c) => `${c.code} (${fmt(c.hp)} hp)`).join(', ')),
    { value: advHp, target: ADVANCED_HP });

  const earlyTm = earlyAdv.filter((c) => c.tm);
  const tmHp = sum(counted.filter((c) => isAdv(c.level) && c.tm)) + sum(earlyTm);
  req('main-field', M.tmTitle(MAIN_FIELD_HP), tmHp >= MAIN_FIELD_HP,
    M.tmDetail(fmt(tmHp), MAIN_FIELD_HP, earlyTm.map((c) => c.code).join(', ')), { value: tmHp, target: MAIN_FIELD_HP });

  const warnings = [];
  if (invalid.length) warnings.push(M.invalid(invalid.map((t) => `"${t}"`).join(', ')));
  if (duplicates.length) warnings.push(M.duplicates([...new Set(duplicates)].join(', ')));
  const both = counted.filter((c) => c.inProfile && c.inSpec);
  if (both.length) warnings.push(M.both(both.map((c) => c.code).join(', ')));
  const assumed = outside.filter((c) => c.hpAssumed);
  if (assumed.length) warnings.push(M.assumedHp(DEFAULT_OUTSIDE_HP, assumed.map((c) => c.code).join(', '), assumed[0].code));
  if (outside.some((c) => !isAdv(c.level))) warnings.push(M.basicLevel);

  const schedule = timetable(cohort, opts.alt, courses, opts.semesters || {});
  return { courses, reqs, warnings, schedule, totals: { totalHp, profHp, specHp, advHp, tmHp } };
}

  fillSelect($('profile'), groups.filter(([, g]) => g.kind === 'profile').map(([k, g]) => [k, groupName(g)]), $('profile').value);

const codesInText = () => new Set(parseInput($('courses').value).entries.map((e) => e.code));

function toggleCourse(code) {
  const codes = [...codesInText()];
  const next = codes.includes(code) ? codes.filter((c) => c !== code) : [...codes, code];
  // Keep any credit/level annotations the user typed for other courses.
  const kept = $('courses').value.toUpperCase().split(/[\s,;]+/).filter(Boolean)
    .filter((tok) => next.includes(tok.split(':')[0]));
  if (!codes.includes(code)) kept.push(code);
  $('courses').value = kept.join(', ');

  update();

const slotText = (inst) => inst.map(([p, b]) => b === '-' ? `${t().period}${p} · ${t().noBlock}` : `${t().period}${p} · ${t().block} ${b}`).join(' + ');
const instText = (insts) => insts.map(slotText).join(` ${t().or} `);

// Chronological order of the plan: one section per semester with sub-sections per period
// (courses over both periods last), then courses without a timetable. Used by the table and the exports.
const REQ_GROUPS = [
  ['profile-mandatory', 'profile-hp', 'profile-adv'],
  ['spec-mandatory', 'spec-hp'],
  ['business', 'outside', 'total', 'advanced', 'main-field'],
];
const PERIOD_ORDER = ['1', '2', '12'];
const periodKey = (course) => [...new Set(course.slots.map(([p]) => p))].sort().join('');
function termLabel(sem) {
  const startYear = parseInt(cohortOf().label.slice(3), 10);
  return sem === 8 ? `VT ${startYear + 4}` : `HT ${startYear + (sem === 7 ? 3 : 4)}`;
}
function chronological(r) {
  const sections = [];
  for (const sem of [7, 8, 9]) {
    const inSem = r.courses.filter((course) => course.sem === sem);
    if (!inSem.length) continue;
    const periods = PERIOD_ORDER.map((key) => [key, inSem.filter((course) => periodKey(course) === key)
      .sort((a, b) => a.slots[0][1].localeCompare(b.slots[0][1]) || a.code.localeCompare(b.code))])
      .filter(([, list]) => list.length);
    sections.push({ sem, label: t().semHead(sem, termLabel(sem)), hp: r.schedule.perSemester[sem], periods });
  }
  const rest = r.courses.filter((course) => !course.sem);
  if (rest.length) {
    sections.push({ sem: null, label: t().noTimetable, hp: rest.reduce((s, course) => s + (course.counted ? course.hp : 0), 0), periods: [[null, rest]] });
  }
  return sections;
}

function renderResults(r) {
  const met = r.reqs.filter((q) => q.ok).length, total = r.reqs.length;
  const clashes = r.schedule.collisions.length;
  const v = $('verdict');
  v.className = 'verdict ' + (met === total ? 'reqs-ok' : 'reqs-bad') + (clashes ? ' has-clash' : met === total ? ' all-ok' : '');
  const missing = r.reqs.filter((q) => !q.ok).map((q) => q.title.toLowerCase());
  v.innerHTML = `<div class="score">${met}<small>/${total}</small></div><div>
    <strong>${met === total ? esc(t().allMet) : esc(t().notMet(total - met))}</strong>
    <span>${met === total ? esc(t().hpCounted(hp(r.totals.totalHp))) : esc(t().notMetList(missing.join('; ')))}</span>
    ${clashes ? `<span class="clash-line">${esc(t().clashLine(clashes))}</span>` : ''}</div>
    <button type="button" class="export-open" id="export-open">${esc(t().exportOpen)}</button>`;

  $('warnings').innerHTML = r.warnings.map((w) => `<li>${esc(w)}</li>`).join('');

  $('reqs').innerHTML = REQ_GROUPS.map((ids, gi) => `<div class="req-group"><h3>${esc(t().groups[gi])}</h3>${ids.map((id) => {
    const q = r.reqs.find((x) => x.id === id);
    let meter = '';
    if (q.progress && q.progress.target) {
      const frac = Math.min(1, q.progress.value / q.progress.target);
      meter = `<div class="meter ${q.ok ? '' : 'bad'}" role="img" aria-label="${hp(q.progress.value)} / ${q.progress.target}"><i style="width:${(frac * 100).toFixed(1)}%"></i></div>`;
    }
    return `<div class="req"><span class="pill ${q.ok ? 'ok' : 'bad'}">${esc(q.ok ? t().met : t().notMetPill)}</span>
      <div class="req-title">${esc(q.title)}</div><div class="req-detail">${esc(q.detail)}</div>${meter}</div>`;
  }).join('')}</div>`).join('');

  const clashing = new Set(r.schedule.collisions.flatMap((x) => [x.a, x.b]));
  const row = (course) => {
    let semCell = '—';
    if (course.semOptions) {
      const also = course.otherSlots.length ? ` (${t().alsoGiven} ${instText(course.otherSlots)})` : '';
      semCell = (course.semOptions.length > 1
        ? `<select data-sem="${esc(course.code)}" aria-label="${esc(t().thSemester)} ${esc(course.code)}">${course.semOptions.map((s) => `<option value="${s}"${s === course.sem ? ' selected' : ''}>${s}</option>`).join('')}</select>`
        : `<span class="mono">${course.sem}</span>`) + `<span class="slots">${esc(slotText(course.slots) + also)}</span>`;
    }
    return `<tr class="${clashing.has(course.code) ? 'clashing' : ''}">
      <td class="code">${esc(course.code)}</td>
      <td>${esc(course.name || '—')}${course.note ? `<span class="course-note">${esc(course.note)}</span>` : ''}</td>
      <td class="num">${hp(course.hp)}</td>
      <td class="mono">${esc(course.level || '—')}</td>
      <td>${semCell}</td>
      <td><span class="role ${course.role}">${esc(t().roles[course.role])}</span></td></tr>`;
  };
  $('course-rows').innerHTML = r.courses.length ? chronological(r).map((sec) =>
    `<tr class="sem-head"><th colspan="6">${esc(sec.label)}<span>${hp(sec.hp)} hp</span></th></tr>`
      + sec.periods.map(([key, list]) => (key ? `<tr class="period-head"><td colspan="6">${esc(t().periodHead(key))}</td></tr>` : '') + list.map(row).join('')).join('')).join('')
    : `<tr><td colspan="6" class="empty">${esc(t().noCourses)}</td></tr>`;

  renderTimetable(r);
}

function renderTimetable(r) {
  const s = r.schedule;
  const c = cohortOf();
  const nameOf = (code) => {
    const info = c.courses[code] || ALT.c[code];
    return info ? `${code} ${courseName(info)}` : code;
  };
  const tiles = [7, 8, 9].map((sem) => `<div class="sem-tile"><span>${esc(t().thSemester)} ${sem}</span><b>${hp(s.perSemester[sem])} hp</b></div>`).join('')
    + (s.unplacedHp ? `<div class="sem-tile"><span>${esc(t().unscheduled)}</span><b>${hp(s.unplacedHp)} hp</b></div>` : '');
  let body = '';
  if (!s.collisions.length) {
    body = `<p class="ok-note">${esc(t().noClash)}</p>`;
  } else {
    // Moving a course to another TMA semester needs no exception; the caveat is for other programs and other courses.
    const risky = s.collisions.some((x) => x.options.slice(0, 10).some((o) => o.type !== 'move'));
    body = (risky ? `<p class="caveat"><strong>${esc(t().caveatTitle)}</strong>${esc(t().caveat)}</p>` : '') + s.collisions.map((x) => {
      const alts = x.options.slice(0, 10).map((o) => {
        if (o.type === 'move') {
          return `<li><div><span class="alt-kind">${esc(t().move)}</span>${esc(t().moveText(o.code, o.sem))}<span class="alt-meta">${esc(instText(o.slots))}</span></div>
            <button type="button" data-move="${esc(o.code)}" data-to="${o.sem}">${esc(t().moveBtn(o.sem))}</button></li>`;
        }
        const g = o.group;
        const progs = g.p.map((p) => `${p} ${ALT.progs[p] || ''}`.trim()).join(', ');
        const where = `${g.t} · ${slotText(g.s)} · ${g.campus} · ${g.lang}`;
        if (o.type === 'program') {
          return `<li><div><span class="alt-kind">${esc(t().program)}</span>${esc(t().programText(o.code, progs))}<span class="alt-meta">${esc(where)}. ${esc(t().fits(o.sem))}.</span></div></li>`;
        }
        const info = o.info;
        return `<li><div><span class="alt-kind">${esc(t().similar)}</span><a href="https://studieinfo.liu.se/${state.lang === 'en' ? 'en/' : ''}kurs/${esc(o.code)}" target="_blank" rel="noopener">${esc(o.code)} ${esc(courseName(info))}</a>, ${hp(info.hp || 0)} hp${info.l ? ', ' + esc(info.l) : ''}
          <span class="alt-meta">${esc(where)}. ${esc(t().fits(o.sem))}. ${esc(t().similarCounts(o.inPlan))}</span>
          <span class="alt-meta">${esc(t().programText(o.code, progs))}</span></div></li>`;
      }).join('');
      const searches = [x.a, x.b].map((code) => {
        const info = c.courses[code];
        const q = encodeURIComponent(info.n);
        return `<a href="https://studieinfo.liu.se/${state.lang === 'en' ? 'en/' : ''}?Term=${q}&Type=course&MainFieldOfStudy=" target="_blank" rel="noopener">${esc(courseName(info))}</a>`;
      }).join(' · ');
      return `<div class="clash">
        <div class="clash-head"><strong>${esc(t().clashHead(nameOf(x.a), nameOf(x.b)))}</strong><span>${esc(t().clashWhere(x.sem, x.period, x.block))}</span></div>
        ${alts ? `<ul class="alts">${alts}</ul>` : `<p class="hint">${esc(t().noAlts)}</p>`}
        <div class="search-links">${esc(t().search)} ${searches}</div>
      </div>`;
    }).join('');
  }
  $('timetable').innerHTML = `<h2>${esc(t().ttTitle)}</h2><div class="tt-summary">${tiles}</div>${body}<p class="hint">${esc(t().ttHint)}</p>`;
}

// ---- Export (PDF and Excel). The libraries are loaded from jsDelivr only when someone exports. ----
const LIBS = {
  pdf: [
    ['https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js', 'sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3'],
    ['https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.8/dist/jspdf.plugin.autotable.min.js', 'sha384-5jk55M0XWoAw7LyhlXJe19ErOr3doBAPzxw9vahPFbvolqWa2yDk4fhHa2zuYeOa'],
  ],

};
const loadedScripts = {};
function loadScript([src, integrity]) {
  loadedScripts[src] = loadedScripts[src] || new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.integrity = integrity; s.crossOrigin = 'anonymous';
    s.onload = resolve;
    s.onerror = () => { delete loadedScripts[src]; s.remove(); reject(new Error(`Could not load ${src}`)); };
    document.head.appendChild(s);
  });
  return loadedScripts[src];
}
async function loadLibs(format) { for (const lib of LIBS[format]) await loadScript(lib); }

function planProblems(r) {
  return [
    ...r.reqs.filter((q) => !q.ok).map((q) => `${q.title}: ${q.detail}`),
    ...r.schedule.collisions.map((x) => t().clashItem(x.a, x.b, x.sem, x.period, x.block)),
  ];
}

// Plain-text version of a collision alternative, for the exported files.
function altPlain(o) {
  if (o.type === 'move') return `${t().move}: ${t().moveText(o.code, o.sem).replace(/\.$/, '')} (${instText(o.slots)}).`;
  const g = o.group;
  const where = `${g.t}, ${slotText(g.s)}, ${g.campus}`;
  if (o.type === 'program') return `${t().program}: ${t().programText(o.code, g.p.join(', '))}. ${where}. ${t().fits(o.sem)}.`;
  return `${t().similar}: ${o.code} ${courseName(o.info)} (${hp(o.info.hp || 0)} hp). ${where}. ${t().fits(o.sem)}. ${t().similarCounts(o.inPlan)}`;
}

function exportData(r) {
  const c = cohortOf();
  const F = t().file;
  const problems = planProblems(r);
  const rows = chronological(r).flatMap((sec) => sec.periods.flatMap(([key, list]) => list.map((course) => ({
    term: sec.sem ? `${sec.sem} (${termLabel(sec.sem)})` : '–',
    period: key ? (key === '12' ? '1–2' : key) : '–',
    block: course.slots ? [...new Set(course.slots.map(([, b]) => b))].join(', ').replace('-', '–') : '–',
    code: course.code, name: course.name || '', hp: course.hp, level: course.level || '',
    role: t().roles[course.role], note: course.note || '', counted: course.counted,
    clashing: r.schedule.collisions.some((x) => x.a === course.code || x.b === course.code),
  }))));
  return {
    ok: problems.length === 0, problems, rows, r,
    meta: [
      [F.program, F.programValue],
      [t().cohort, c.label],
      [t().profile, groupName(c.groups[$('profile').value])],
      [t().spec, groupName(c.groups[$('spec').value])],
      [F.exported, new Date().toLocaleDateString('sv-SE')],
    ],
    reqGroups: REQ_GROUPS.map((ids, gi) => ({ title: t().groups[gi], reqs: ids.map((id) => r.reqs.find((q) => q.id === id)) })),
    totals: [7, 8, 9].map((sem) => [`${t().thSemester} ${sem} (${termLabel(sem)})`, r.schedule.perSemester[sem]]),
    collisions: r.schedule.collisions.map((x) => ({ ...x, text: t().clashItem(x.a, x.b, x.sem, x.period, x.block), alts: x.options.slice(0, 10).map(altPlain) })),
    risky: r.schedule.collisions.some((x) => x.options.slice(0, 10).some((o) => o.type !== 'move')),
  };
}

function exportFilename(ext) {
  return `${t().file.name}-${cohortOf().label.replace(' ', '')}-${$('profile').value}-${$('spec').value}.${ext}`;
}

function exportPdf(d) {
  const F = t().file;
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  const M = 40, W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const GREEN = [43, 117, 71], RED = [178, 63, 44], GREY = [102, 102, 100], BAND = [242, 242, 240];
  let y = M + 6;
  const space = (h) => { if (y + h > H - M - 20) { doc.addPage(); y = M; } };
  const para = (text, { size = 10, style = 'normal', color = [27, 27, 27], indent = 0, gap = 4 } = {}) => {
    doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
    const lines = doc.splitTextToSize(text, W - 2 * M - indent);
    space(lines.length * size * 1.25);
    doc.text(lines, M + indent, y + size * 0.8);
    y += lines.length * size * 1.25 + gap;
  };
  const heading = (text) => { y += 10; para(text, { size: 13, style: 'bold', gap: 6 }); };
  const table = (opts) => {
    window.autoTable(doc, { startY: y, margin: { left: M, right: M, bottom: M + 20 }, theme: 'plain', rowPageBreak: 'avoid',
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 4, textColor: [27, 27, 27], lineColor: [225, 225, 222], lineWidth: { bottom: 0.5 } },
      headStyles: { fontStyle: 'bold', textColor: GREY, fontSize: 8 }, ...opts });
    y = doc.lastAutoTable.finalY + 8;
  };

  para(`TMA Degree Check – ${F.title}`, { size: 18, style: 'bold', gap: 10 });
  for (const [k, v] of d.meta) {
    doc.setFontSize(10); doc.setFont('helvetica', 'bold'); doc.setTextColor(27, 27, 27); doc.text(`${k}:`, M, y + 8);
    doc.setFont('helvetica', 'normal'); doc.text(doc.splitTextToSize(v, W - 2 * M - 120), M + 120, y + 8);
    y += 14;
  }
  y += 8;

  // Status box: green when complete, red with the list of problems otherwise.
  const statusLines = d.ok ? [F.statusOk] : [F.statusBad, ...d.problems.map((p) => `•  ${p}`)];
  doc.setFontSize(10);
  const wrapped = statusLines.map((l) => doc.splitTextToSize(l, W - 2 * M - 24));
  const boxH = wrapped.reduce((h, l) => h + l.length * 12.5, 0) + 16;
  space(boxH);
  doc.setDrawColor(...(d.ok ? GREEN : RED)); doc.setLineWidth(1); doc.rect(M, y, W - 2 * M, boxH);
  doc.setFillColor(...(d.ok ? GREEN : RED)); doc.rect(M, y, 3, boxH, 'F');
  let ty = y + 8;
  wrapped.forEach((lines, i) => {
    doc.setFont('helvetica', i === 0 ? 'bold' : 'normal'); doc.setTextColor(...(i === 0 ? (d.ok ? GREEN : RED) : [27, 27, 27]));
    doc.text(lines, M + 12, ty + 9); ty += lines.length * 12.5;
  });
  y += boxH + 10;

  heading(F.sheetReqs);
  table({
    head: [[F.status, F.requirement, F.result]],
    body: d.reqGroups.flatMap((g) => [
      [{ content: g.title, colSpan: 3, styles: { fontStyle: 'bold', fillColor: BAND } }],
      ...g.reqs.map((q) => [{ content: q.ok ? t().met : t().notMetPill, styles: { textColor: q.ok ? GREEN : RED, fontStyle: 'bold' } }, q.title, q.detail]),
    ]),
    columnStyles: { 0: { cellWidth: 62 }, 1: { cellWidth: 170 } },
  });

  heading(t().yourCourses);
  const sections = chronological(d.r);
  table({
    head: [[t().thSemester, F.period, F.block, t().thCode, t().thCourse, 'hp', t().thLevel, t().thCounts]],
    body: sections.flatMap((sec) => [
      [{ content: `${sec.label} – ${hp(sec.hp)} hp`, colSpan: 8, styles: { fontStyle: 'bold', fillColor: BAND } }],
      ...d.rows.filter((row) => row.term === (sec.sem ? `${sec.sem} (${termLabel(sec.sem)})` : '–')).map((row) => [
        row.term.split(' ')[0], row.period, row.block,
        { content: row.code, styles: row.clashing ? { textColor: RED, fontStyle: 'bold' } : {} },
        row.note ? `${row.name}\n${row.note}` : row.name, hp(row.hp), row.level,
        { content: row.role, styles: row.counted ? {} : { textColor: GREY } },
      ]),
    ]),
    columnStyles: { 0: { cellWidth: 44 }, 1: { cellWidth: 38 }, 2: { cellWidth: 34 }, 3: { cellWidth: 50 }, 5: { cellWidth: 28, halign: 'right' }, 6: { cellWidth: 34 }, 7: { cellWidth: 82 } },
  });
  para(`${F.total}: ${hp(d.r.totals.totalHp)} hp. ${d.totals.map(([k, v]) => `${k}: ${hp(v)} hp`).join(', ')}.`, { size: 9, color: GREY });

  heading(t().ttTitle);
  if (!d.collisions.length) para(t().noClash);
  for (const x of d.collisions) {
    para(x.text, { style: 'bold', color: RED, gap: 2 });
    x.alts.forEach((a) => para(`–  ${a}`, { size: 9, indent: 12, gap: 2 }));
    y += 4;
  }
  if (d.risky) para(`${t().caveatTitle} ${t().caveat}`, { size: 9, color: GREY });

  heading(t().assumedTitle);
  t().assumed.forEach((a) => para(`•  ${a}`, { size: 9, gap: 2 }));

  // Footer on every page.
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.text(doc.splitTextToSize(t().unofficial, W - 2 * M - 70), M, H - M + 4);
    doc.text(F.page(i, pages), W - M, H - M + 4, { align: 'right' });
  }
  doc.save(exportFilename('pdf'));
}

function exportXlsx(d) {
  const F = t().file;
  const XLSX = window.XLSX;
  const wb = XLSX.utils.book_new();
  const sheet = (rows, widths) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = widths.map((wch) => ({ wch })); return ws; };

  const plan = [
    [`TMA Degree Check – ${F.title}`], ...d.meta, [],
    [d.ok ? F.statusOk : F.statusBad], ...d.problems.map((p) => ['', p]), [],
    [t().thSemester, F.period, F.block, t().thCode, t().thCourse, 'hp', t().thLevel, t().thCounts, F.note],
    ...d.rows.map((row) => [row.term, row.period, row.block, row.code, row.name, row.hp, row.level, row.role, row.note]),
    [], [F.totals], ...d.totals, [F.total, d.r.totals.totalHp], [],
    [t().unofficial],
  ];
  XLSX.utils.book_append_sheet(wb, sheet(plan, [16, 8, 8, 10, 46, 6, 7, 22, 50]), F.sheetPlan);

  const reqs = [[F.part, F.requirement, F.status, F.result],
    ...d.reqGroups.flatMap((g) => g.reqs.map((q) => [g.title, q.title, q.ok ? t().met : t().notMetPill, q.detail]))];
  XLSX.utils.book_append_sheet(wb, sheet(reqs, [24, 44, 12, 90]), F.sheetReqs);

  if (d.collisions.length) {
    const clashes = [[t().thSemester, F.period, F.block, F.courseA, F.courseB, F.alternatives],
      ...d.collisions.map((x) => [x.sem, x.period, x.block, x.a, x.b, x.alts.join('\n')])];
    if (d.risky) clashes.push([], [`${t().caveatTitle} ${t().caveat}`]);
    XLSX.utils.book_append_sheet(wb, sheet(clashes, [8, 8, 8, 10, 10, 110]), F.sheetClashes);
  }
  XLSX.writeFile(wb, exportFilename('xlsx'));
}

function openExport() {
  const r = lastResult;
  const problems = planProblems(r);
  const empty = r.courses.length === 0;
  const status = $('export-status');
  status.className = 'export-status' + (empty || problems.length ? ' bad' : '');
  status.innerHTML = empty ? `<strong>${esc(t().exportEmpty)}</strong>`
    : problems.length ? `<strong>${esc(t().exportProblems)}</strong><ul>${problems.map((p) => `<li>${esc(p)}</li>`).join('')}</ul><p>${esc(t().exportProblemsNote)}</p>`
    : `<strong>✓ ${esc(t().exportOk)}</strong>`;
  $('export-go').textContent = problems.length && !empty ? t().exportAnyway : t().exportGo;
  $('export-go').disabled = empty;
  $('export-error').hidden = true;
  $('export-dialog').showModal();
}

async function runExport(e) {
  e.preventDefault();
  const format = $('format-xlsx').checked ? 'xlsx' : 'pdf';
  const go = $('export-go'), label = go.textContent;
  go.disabled = true; go.textContent = t().exporting; $('export-error').hidden = true;
  try {
    await loadLibs(format);
    const d = exportData(lastResult);
    if (format === 'pdf') exportPdf(d); else exportXlsx(d);
    $('export-dialog').close();
  } catch (err) {
    console.error(err);
    $('export-error').textContent = t().exportFailed;
    $('export-error').hidden = false;
  } finally {
    go.disabled = false; go.textContent = label;
  }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ cohort: $('cohort').value, profile: $('profile').value, spec: $('spec').value,
      text: $('courses').value, semesters: state.semesters, lang: state.langChosen ? state.lang : undefined, isExample: state.isExample }));
  } catch (e) {}
}

function update() {
  $('example-tag').hidden = !state.isExample;
  const r = validate(cohortOf(), $('profile').value, $('spec').value, $('courses').value,
    { lang: state.lang, semesters: state.semesters, alt: ALT });
  lastResult = r;
  renderResults(r);
  renderPicker();
  save();
}

function load(saved) {
  $('cohort').value = saved.cohort;
  fillGroups();
  $('profile').value = saved.profile;
  $('spec').value = saved.spec;
  $('courses').value = saved.text;
  state.semesters = { ...(saved.semesters || {}) };
}

function setLang(lang) { state.lang = lang; state.langChosen = true; renderStatic(); update(); }

fillSelect($('cohort'), DATA.map((c) => [c.id, c.label]), '5270');
let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
// Swedish unless the viewer has picked a language with the toggle.
state.langChosen = !!(saved && saved.lang);
state.lang = state.langChosen ? saved.lang : 'sv';
if (saved && DATA.some((c) => c.id === saved.cohort)) { load(saved); state.isExample = !!saved.isExample; }
else { load(EXAMPLE); state.isExample = true; }
renderStatic();
update();

$('lang-sv').addEventListener('click', () => setLang('sv'));
$('lang-en').addEventListener('click', () => setLang('en'));
$('cohort').addEventListener('change', () => { renderStatic(); update(); });
$('profile').addEventListener('change', update);
$('spec').addEventListener('change', update);
$('courses').addEventListener('input', () => { state.isExample = false; update(); });
$('clear').addEventListener('click', () => { $('courses').value = ''; state.semesters = {}; state.isExample = false; update(); $('courses').focus(); });
$('example').addEventListener('click', () => { load(EXAMPLE); state.isExample = true; update(); });
$('picker').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) toggleCourse(b.dataset.code); });
$('course-rows').addEventListener('change', (e) => {
  const sel = e.target.closest('select[data-sem]');
  if (sel) { state.semesters[sel.dataset.sem] = Number(sel.value); state.isExample = false; update(); }
});
$('timetable').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-move]');
  if (b) { state.semesters[b.dataset.move] = Number(b.dataset.to); state.isExample = false; update(); }
});
$('plan').addEventListener('submit', (e) => e.preventDefault());
$('verdict').addEventListener('click', (e) => { if (e.target.closest('#export-open')) openExport(); });
$('export-cancel').addEventListener('click', () => $('export-dialog').close());
$('export-form').addEventListener('submit', runExport);
</script>
</body>
</html>
